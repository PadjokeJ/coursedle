[package]
name = "coursedle"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
soup = "0.5.1"
markup5ever = "0.7.5"
regex = "1.13.1"

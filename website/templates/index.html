<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coursedle | Guess an EPFL course daily!</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="centering">
        <div id="guesser">
            <input type="text" id="guess_input">
            <select name="course_id" id="course_id"></select>
            <a href="#" id="submit_guess">Guess !</a>
        </div>
        <table id="guesses">
            <tbody id="tbody">
                <tr id="guess_title">
                    <th>ID</th>
                    <th>Name</th>
                    <th>Language</th>
                    <th>Credits</th>
                    <th>Semester</th>
                    <th>Section</th>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="/static/coursedle.js"></script>
</body>
</html>
